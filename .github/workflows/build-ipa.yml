name: Build IPA from your own Spotify IPA

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "Direct link to a decrypted Spotify IPA"
        required: false
        default: "https://github.com/kassou20/spoti.pw/releases/download/spotify-ipa/Spotify-9.1.78.ipa"
        type: string
      upload_method:
        description: "Where to put the result"
        default: artifacts
        type: choice
        options: [artifacts, filebin, both]
  push:
    branches: [main]

env:
  THEOS: ${{ github.workspace }}/theos

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: levibostian/action-hide-sensitive-inputs@v1

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/checkout@v5
        with:
          repository: theos/theos
          path: theos
          submodules: recursive

      - name: Install tools
        run: |
          brew install make dpkg ldid
          python3 -m pip install --break-system-packages git+https://github.com/asdfzxcvbn/pyzule-rw.git

      - name: Download IPA
        run: |
          mkdir -p ipa
          IPA_URL="${{ inputs.ipa_url || 'https://github.com/kassou20/spoti.pw/releases/download/spotify-ipa/Spotify-9.1.78.ipa' }}"
          curl -fsSL -L "$IPA_URL" -o ipa/spotify.ipa
          case "$(file --mime-type -b ipa/spotify.ipa)" in application/zip|application/x-ios-app) ;; *) echo "::error::Not an IPA"; exit 1 ;; esac

      - name: Strip IPAOMTK watermark dylib
        run: |
          set -euo pipefail
          WORK="$(mktemp -d)"
          unzip -q ipa/spotify.ipa -d "$WORK"
          APP_DIR="$(ls -d "$WORK"/Payload/*.app)"
          FW="$APP_DIR/Frameworks"

          # Build a tiny stub dylib to replace the watermark one.
          # The stub loads and does nothing, so any existing LC_LOAD_DYLIB still resolves.
          echo 'void __attribute__((constructor)) _stub(void) {}' > "$WORK/stub.c"
          xcrun --sdk iphoneos clang -target arm64-apple-ios16.0 -dynamiclib \
            -install_name @rpath/IPAOMTK.dylib -o "$WORK/IPAOMTK.dylib" "$WORK/stub.c"

          if [ -f "$FW/IPAOMTK.dylib" ]; then
            echo "Replacing IPAOMTK.dylib ($(stat -f%z "$FW/IPAOMTK.dylib") bytes) with stub ($(stat -f%z "$WORK/IPAOMTK.dylib") bytes)"
            cp "$WORK/IPAOMTK.dylib" "$FW/IPAOMTK.dylib"
          fi
          # Also stub Fixipa.dylib — another ipaomtk injected lib that may carry branding
          if [ -f "$FW/Fixipa.dylib" ]; then
            echo 'void __attribute__((constructor)) _stub2(void) {}' > "$WORK/stub2.c"
            xcrun --sdk iphoneos clang -target arm64-apple-ios16.0 -dynamiclib \
              -install_name @rpath/Fixipa.dylib -o "$WORK/Fixipa.dylib" "$WORK/stub2.c"
            echo "Replacing Fixipa.dylib ($(stat -f%z "$FW/Fixipa.dylib") bytes) with stub"
            cp "$WORK/Fixipa.dylib" "$FW/Fixipa.dylib"
          fi

          # Re-pack the IPA
          (cd "$WORK" && zip -qr ipa.zip Payload/)
          mv "$WORK/ipa.zip" ipa/spotify.ipa
          rm -rf "$WORK"
          echo "IPA repackaged with watermark dylibs stubbed out"

      - run: make release

      - uses: actions/upload-artifact@v5
        if: inputs.upload_method != 'filebin'
        with:
          name: spoti.ipa
          path: out/*.ipa
          if-no-files-found: error

      - name: Upload to filebin.net
        if: inputs.upload_method == 'filebin' || inputs.upload_method == 'both'
        run: |
          BIN="spotifyglass-${{ github.run_id }}"
          echo "### filebin.net download" >> "$GITHUB_STEP_SUMMARY"
          for f in out/*.ipa; do
            curl -fsS -X POST -H "Content-Type: application/octet-stream" --data-binary "@$f" "https://filebin.net/$BIN/$(basename "$f")" >/dev/null
            echo "- https://filebin.net/$BIN/$(basename "$f")" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "- _filebin deletes bins after a few days of inactivity, download promptly._" >> "$GITHUB_STEP_SUMMARY"
